name: Ubuntu Desktop via VNC

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-desktop
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Install desktop and VNC
        env:
          VNC_PASS: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -e
          if [ -z "$VNC_PASS" ]; then echo "❌ خطأ: لم يتم إضافة VNC_PASSWORD"; exit 1; fi
          
          export DEBIAN_FRONTEND=noninteractive
          
          # تسريع السيرفرات وإلغاء حزم ARM
          sudo rm -rf /etc/apt/sources.list.d/*
          sudo tee /etc/apt/sources.list > /dev/null <<EOF
          deb http://archive.ubuntu.com/ubuntu/ jammy main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu/ jammy-updates main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu/ jammy-backports main restricted universe multiverse
          deb http://security.ubuntu.com/ubuntu/ jammy-security main restricted universe multiverse
          EOF
          echo 'Acquire::Architectures "amd64";' | sudo tee /etc/apt/apt.conf.d/99force-arch > /dev/null
          
          sudo apt-get update -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=15
          
          # تثبيت LXDE (خفيفة ومستقرة) مع x11vnc
          sudo apt-get install -y --no-install-recommends -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=15 \
            lxde x11vnc xvfb novnc websockify
            
          mkdir -p ~/.vnc
          # x11vnc يحتاج كلمة مرور ملف
          x11vnc -storepasswd "$VNC_PASS" ~/.vnc/passwd
          
          echo "🖥️ جاري تشغيل الشاشة الوهمية..."
          # تشغيل شاشة وهمية في الخلفية
          Xvfb :1 -screen 0 1366x768x24 &
          sleep 2
          
          echo "🪟 جاري تشغيل واجهة LXDE..."
          DISPLAY=:1 startlxde &
          sleep 3
          
          echo "🔗 جاري تشغيل VNC..."
          x11vnc -display :1 -forever -shared -rfbauth ~/.vnc/passwd -rfbport 5901 &
          sleep 2
          
          echo "🌐 جاري تشغيل WebSockify..."
          websockify -D --web /usr/share/novnc 127.0.0.1:6080 localhost:5901
          
          echo "✅ الواجهة تعمل!"

      - name: Start Cloudflare Tunnel
        run: |
          echo "🌐 جاري إنشاء رابط الاتصال..."
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          setsid nohup ./cloudflared tunnel --url http://127.0.0.1:6080 --no-autoupdate > tunnel.log 2>&1 &
          
          for i in $(seq 1 40); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel.log | grep -v '^https://api\.' | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          
          if [ -z "$URL" ]; then echo "❌ فشل إنشاء النفق"; cat tunnel.log; exit 1; fi
          
          LINK="$URL/vnc.html?autoconnect=true&resize=remote"
          echo "::notice title=Desktop link::$LINK"
          echo "### 🔗 رابط الدخول: [اضغط هنا للاتصال]($LINK)" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ الرابط جاهز!"

      - name: Keep Alive
        run: |
          echo "✅ النظام يعمل الآن. اذهب إلى صفحة Summary في الأعلى واضغط على الرابط."
          while pgrep -f "Xvfb :1" > /dev/null && pgrep -f "cloudflared tunnel" > /dev/null; do 
            sleep 300
          done
          echo "❌ توقفت إحدى الخدمات."
          exit 1
